services:
  backend:
    container_name: chatfusion_backend
    build: .
    restart: always
    ports:
      - "5550:5550"
    environment:
      NODE_ENV: production
      DB_DIALECT: mysql
      # Use external MySQL database on host port 3307:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3307          # ✅ external port
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: whatsapp_portal
      DB_POOL_MAX: 10
      DB_POOL_MIN: 0
      DB_POOL_IDLE: 10000
      DB_POOL_ACQUIRE: 30000
    networks:
      - whatsapp_network
    command: sh -c "npm start"

networks:
  whatsapp_network:
    external: true
