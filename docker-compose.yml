# docker-compose.yml (backend)
services:
  backend:
    container_name: chatfusion_backend
    build: .
    restart: always
    ports:
      - "5550:5550"
    environment:
      NODE_ENV: production
      DB_DIALECT: mysql
      # For production: connect to external MySQL on host port 3307
      # For Docker network: use service name and container port 3306
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3307}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: ${MYSQL_DB:-whatsapp_portal}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_IDLE: ${DB_POOL_IDLE:-10000}
      DB_POOL_ACQUIRE: ${DB_POOL_ACQUIRE:-30000}
    networks:
      - whatsapp_network
    command: sh -c "npm start"

networks:
  whatsapp_network:
    external: true
