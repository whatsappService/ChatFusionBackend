services:
  backend:
    container_name: chatfusion_backend
    build: .
    restart: always
    ports:
      - "5550:5550"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - whatsapp_network
    command: sh -c "npm start"

networks:
  whatsapp_network:
    external: true   # <<< use the existing network instead of creating a new one
