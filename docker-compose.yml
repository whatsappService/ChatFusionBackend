# docker-compose.yml (backend)
# Usage:
#   docker-compose up -d                    # Uses .env.production
#   docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d  # Uses custom env

services:
  backend:
    container_name: chatfusion_backend
    build: .
    restart: always
    ports:
      - "5550:5550"
    env_file:
      - .env.production
    environment:
      # Override database connection for Docker
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3307
      # Ensure production mode
      NODE_ENV: production
      # Trust proxy for Docker
      TRUST_PROXY: true
    networks:
      - whatsapp_network
    command: sh -c "npm start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5550/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  whatsapp_network:
    external: true
