version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: always
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whatsapp_portal
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    ports:
      - "5550:5550"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Override MYSQL_HOST to use the db container hostname
      MYSQL_HOST: db
    depends_on:
      - db
    command: sh -c "npx sequelize-cli db:migrate && npm start"

volumes:
  db_data:
